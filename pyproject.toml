[project]
name = "person-tracking-experiment"
version = "0.1.0"
description = "独立的离线人物视频识别与跟踪实验"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24,<2",
    "opencv-python>=4.8,<5",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "ultralytics==8.4.154",
]

[project.optional-dependencies]
export = [
    "onnx>=1.16,<1.18",
    "onnxruntime>=1.20,<1.23",
    "onnxslim>=0.1.82,<0.2",
]
# Jetson TensorRT 的 Python bindings 和原生库由 JetPack/APT 提供。
# 此 extra 声明运行依赖；uv 不从 PyPI 安装，环境接入方法见 README。
tensorrt = [
    "tensorrt>=10,<11; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv]
# 使用设备配套的 python3-libnvinfer，避免解析到桌面/SBSA 的 TensorRT 包。
exclude-dependencies = ["tensorrt"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [
    { index = "jetson-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchvision = [
    { index = "jetson-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[[tool.uv.index]]
name = "jetson-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
